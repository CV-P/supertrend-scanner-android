name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SupertrendScanner_Android_APK_Project_GitHub.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q SupertrendScanner_Android_APK_Project_GitHub.zip -d appsrc
          echo "Extracted project:"
          find appsrc -maxdepth 3 -type f | sort | head -100

      - name: Detect project root
        id: root
        shell: bash
        run: |
          ROOT="$(find appsrc -name settings.gradle -type f -printf '%h\n' | head -1)"
          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.root }}
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          APK="$(find "${{ steps.root.outputs.root }}" -path '*/build/outputs/apk/debug/*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" output/SupertrendScanner-debug.apk
          ls -lh output/SupertrendScanner-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupertrendScanner-APK
          path: output/SupertrendScanner-debug.apk
          if-no-files-found: error
          
