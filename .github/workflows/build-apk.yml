name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SupertrendScanner_Android_APK_Project_GitHub.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q SupertrendScanner_Android_APK_Project_GitHub.zip -d appsrc

      - name: Detect project root
        id: root
        shell: bash
        run: |
          ROOT="$(find appsrc -name gradlew -type f -printf '%h\n' | head -1)"
          if [ -z "$ROOT" ]; then
            echo "gradlew not found"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          chmod +x "$ROOT/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.root }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          APK="$(find "${{ steps.root.outputs.root }}" -path '*/build/outputs/apk/debug/*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" output/SupertrendScanner-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupertrendScanner-APK
          path: output/SupertrendScanner-debug.apk
          if-no-files-found: error
